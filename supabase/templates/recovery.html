<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your House password</title>
  </head>
  <body style="margin: 0; background: #f4f1ea; color: #17201d; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background: #f4f1ea; padding: 32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 560px; background: #ffffff; border: 1px solid #ddd8ce; border-radius: 16px;">
            <tr>
              <td style="padding: 32px;">
                <p style="margin: 0 0 8px; color: #577066; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;">House</p>
                <h1 style="margin: 0 0 16px; color: #17201d; font-size: 26px; line-height: 1.25;">Reset your password</h1>
                <p style="margin: 0 0 24px; color: #46534e; font-size: 16px; line-height: 1.6;">
                  Use the button below to choose a new password for your House account.
                </p>
                <p style="margin: 0 0 24px;">
                  <a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 13px 20px; border-radius: 10px; background: #1d5b47; color: #ffffff; font-size: 16px; font-weight: 700; text-decoration: none;">Reset password</a>
                </p>
                <p style="margin: 0 0 8px; color: #66736e; font-size: 13px; line-height: 1.5;">
                  If the button does not work, copy and paste this address into your browser:
                </p>
                <p style="margin: 0 0 24px; overflow-wrap: anywhere; word-break: break-all; font-size: 13px; line-height: 1.5;">
                  <a href="{{ .ConfirmationURL }}" style="color: #1d5b47;">{{ .ConfirmationURL }}</a>
                </p>
                <p style="margin: 0; color: #78837f; font-size: 13px; line-height: 1.5;">
                  If you did not request this reset, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
